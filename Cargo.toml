[package]
name = "hekate"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"
url = "2"
atspi = { version = "0.20", default-features = false, features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
enigo = { version = "0.2.1", default-features = false, features = ["x11rb"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "sqlite", "runtime-tokio-rustls", "migrate"] }
thiserror = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
x11rb = "0.13"
